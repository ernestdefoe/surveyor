      type_wildcard_help: "* matches anything, ? one character. /t/staff* matches /t/staff and everything under it."
      type_regex_help: For experts. Up to 300 characters; patterns that could hang (like nested repeats) are refused.
      pattern: Pattern
      action: Does
      action_exclude: Leave out
      action_include: Include only
      action_exclude_help: Matching addresses are skipped.
      action_include_help: Once any "include only" rule exists, addresses that match none of them are skipped.
      scope: For
