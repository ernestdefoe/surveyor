    issues:
      title_missing: No title
      title_missing_fix: Every page needs a title. FoF SEO sets titles; check its settings for this kind of page.
      title_short: Title too short
      title_short_fix: Titles under 10 characters say little about the page. Rename it to describe what it is about.
      title_long: Title too long
      title_long_fix: Search engines cut titles at about 65 characters. Shorten it, or keep the important words first.
      description_missing: No meta description
      description_missing_fix: Search engines then make up their own snippet. FoF SEO writes descriptions; check it is enabled for this kind of page.
      description_short: Description too short
      description_short_fix: Under 50 characters is rarely enough to make someone click. FoF SEO can be set to use more of the first post.
      description_long: Description too long
      description_long_fix: Search engines show about 160 characters. The rest is cut off.
      canonical_missing: No canonical address
      canonical_missing_fix: Without one, search engines guess which of several addresses is the real page. FoF SEO adds it.
      canonical_elsewhere: Canonical points elsewhere
      canonical_elsewhere_fix: This page tells search engines another address is the real one. That is right for copies; check it is meant here.
      noindex: Hidden from search
      noindex_fix: The page asks search engines not to list it (noindex). Fine for pages you mean to hide; otherwise check FoF SEO's robots settings.
      h1_missing: No main heading
      h1_missing_fix: The page has no h1 heading for search engines to read.
      h1_multiple: Several main headings
      h1_multiple_fix: More than one h1 heading. Usually a theme or an extension adds one; one is best.
      thin_content: Little content
      thin_content_fix: Under 50 words for a guest to read. Pages like this rarely rank; they may be empty, or hidden from guests.
      images_no_alt: Images without alt text
      images_no_alt_fix: Alt text describes an image for screen readers and search engines.
      structured_data_missing: No structured data
      structured_data_missing_fix: No JSON-LD on the page. FoF SEO adds it to discussions; other pages may simply not have any.
      structured_data_invalid: Broken structured data
      structured_data_invalid_fix: A JSON-LD block on the page cannot be read. Check which extension adds it.
      slow: Slow to answer
      slow_fix: The page took over 1.5 seconds to arrive. Search engines crawl slow sites less.

    duplicates:
      title: Same title
      description: Same description
      help: Pages that share a title or description compete with each other in search. Pages that point their canonical at another page are left out, as they already say they are copies.
      empty: No duplicates found.
      count: "{count} pages"

    links:
      help: Links on your pages that lead somewhere a guest cannot simply read. "Members only" links are not broken; they work for people who are signed in.
      all: Every kind
