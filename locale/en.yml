      empty: Nothing to fix here.
      has_redirect: Detour redirect exists
      goes_to: "Redirects to"
      explain_broken: The page is gone (404 or 410). Make a redirect to where it lives now, or remove the links.
      explain_redirect: The link works but takes a detour. Linking to the final address directly is faster.
      explain_restricted: Guests cannot see this page, but it exists. Search engines will not follow these links.
      explain_challenge: A security service (like Cloudflare) showed a challenge page instead. Visitors might be stopped too.
      explain_failed: The request failed or the server answered with an error. Recheck it later.
      sources: "Linked from {count} pages"
      recheck: Recheck
      create_redirect: Create redirect
      ignore: Ignore
      restore: Restore
      checked: "Checked {when}"
      missing_heading: Most-hit 404s in Detour
      missing_help: Addresses visitors and search engines keep asking for that do not exist, from Detour's 404 log. Detour does not record who asked, so bots and people are counted together.
      missing_empty: Detour has not logged any 404s.
