    diagnostics:
      help: Live checks of everything Surveyor depends on. Each check fetches from your forum as a guest would.
      run: Check again
      extension:
        pass: "{name} {version} is enabled"
        pass_help: Surveyor works alongside it.
        warning: "{name} is not enabled"
        warning_help: Surveyor needs it. Enable it on its extension page.
      conflicts:
        pass: No conflicting extensions
        pass_help: Nothing else is sending IndexNow requests or writing competing SEO tags.
        warning: "Conflicting extensions: {names}"
        warning_help: Another IndexNow extension would send every change twice; another SEO extension writes tags FoF SEO already writes. Disable one of them.
      https:
        pass: The forum uses https
        pass_help: "{url}"
        info: The forum uses http
        info_help: Fine on a computer of your own; a public forum should use https.
        warning: The forum uses http, not https
        warning_help: Search engines prefer https. Change the url in config.php once the server has a certificate.
      self_fetch:
        pass: "The server can reach the forum ({ms} ms)"
        pass_help: The audit and the other checks fetch pages from your forum's own address.
        warning: "The server cannot fetch the forum's home page (answer {status})"
        warning_help: The audit cannot work until it can. Check the url in config.php and that the server can reach its own address (some hosts block this).
      canonical_home:
        pass: The home page's canonical address is the forum's address
        pass_help: FoF SEO is writing canonical addresses.
        warning: "The home page's canonical address is missing or different {canonical}"
        warning_help: Check FoF SEO's settings, and that the url in config.php is the address people use.
      sitemap:
        pass: "The sitemap answers and lists {count} entries"
        pass_help: "{url}"
        warning: "The sitemap could not be read (answer {status})"
        warning_help: "Check FoF Sitemap's settings and that it has been built. {url}"
      sitemap_hosts:
        warning: "The sitemap lists {count} addresses on another host"
        warning_help: They usually come from an old url in config.php. Rebuild the sitemap in FoF Sitemap.
      robots:
        pass: robots.txt answers and lists the sitemap
        pass_help: "{url}"
        warning: "robots.txt could not be read (answer {status})"
        warning_help: "Search engines read it first. FoF Sitemap serves one; if your web server answers .txt files itself, let this address reach Flarum. {url}"
      robots_blocks:
        warning: robots.txt blocks the whole forum
        warning_help: "It disallows the forum's home page for every crawler. {url}"
      robots_sitemap:
        warning: robots.txt does not list the sitemap
        warning_help: "Add a line: Sitemap: {sitemap}"
      scheduler:
        pass: Flarum's scheduler is running
        pass_help: Audits and IndexNow submissions happen in the background.
        warning: Flarum's scheduler is not running
        warning_help: "Add the cron job from Flarum's documentation (php flarum schedule:run every minute). Until then, an audit only moves while its page is open."
      queue:
        info: "Queue: {driver}"
        info_help: Surveyor does not use the queue; its work runs from the scheduler.
      indexnow:
        pass: The IndexNow key file opens
        pass_help: "{url}"
        info: IndexNow is off
        info_help: Turn it on in the IndexNow section.
        warning: "The IndexNow key file does not open (answer {status})"
        warning_help: "Search engines refuse submissions until it does. If your web server answers .txt files itself, let this address reach Flarum. {url}"
      tables:
        pass: Surveyor's database tables are in place
        pass_help: Every table its migrations create exists.
        warning: "Missing tables: {tables}"
        warning_help: Disable and enable Surveyor, or run php flarum migrate.

    guide:
      companions_title: Surveyor and its companions
      companions_body: Surveyor is an SEO workspace that works with three other extensions and never does their jobs. FoF SEO writes your titles, descriptions, canonical addresses and structured data. FoF Sitemap builds your sitemap. Detour keeps your redirects and logs 404s. Surveyor checks what they produce, finds what is broken, and fixes it through them.
      dashboard_title: Dashboard
      dashboard_body: The overview. Your average score, how many pages were audited, links to fix, duplicate titles and descriptions, IndexNow, and the issues found on the most pages, so you know what to fix first.
      audit_title: Site audit
      audit_body: Surveyor reads your sitemap and the links on your pages, then visits each page the way a guest would, a few a minute. It records the title, description, canonical, headings, content, images, structured data and speed of each page and gives it a score. Big forums are audited a slice at a time; each audit starts with pages never checked or checked longest ago.
      score_title: How the score works
      score_body: "Every page starts at 100 and loses points for each problem: no title (15), title too short or long (10), no description (15), description too short or long (5), no canonical (10), canonical pointing elsewhere (5), noindex (10), no h1 or several (10), under 50 words (5), images without alt text (5), missing or broken structured data (5), slower than 1.5 seconds (5)."
      links_title: Link recovery
      links_body: Every internal link Surveyor finds is checked. Broken links (404 or 410) can be fixed with a Detour redirect in one step. Links to pages only members can see are shown separately and are not broken. Security challenges (such as Cloudflare's) and failed requests are flagged too. Detour's most-hit 404s are listed underneath.
      indexnow_title: IndexNow
      indexnow_body: When IndexNow is on, Surveyor tells participating search engines about discussions that change, every five minutes, in batches. Only discussions a guest can see are sent, each at most once an hour. A private discussion's address is never sent.
      rules_title: Rules
      rules_body: Patterns that keep areas out of the audit, IndexNow or both, such as a test category. Use an exact address, a wildcard such as /t/staff*, or a regular expression.
      diagnostics_title: Diagnostics
      diagnostics_body: Checks that FoF SEO, FoF Sitemap and Detour are enabled, that your sitemap and robots.txt are reachable and correct, that Flarum's scheduler runs, that the IndexNow key file opens and that nothing conflicts.
      settings_title: Settings
      settings_body: How often an audit starts, how many pages it checks, how fast it goes, how long it waits for a page, and how many audits of history to keep.
      privacy_title: What Surveyor sends where
      privacy_body: The audit only ever requests your own forum, signed out, with the user agent "Surveyor". Nothing else is contacted except IndexNow, and only when you turn it on.

    settings:
      audit_frequency_label: Start a new audit
      audit_frequency_help: Audits run in the background from Flarum's scheduler.
      frequency_daily: Every day
      frequency_weekly: Every week
      frequency_monthly: Every month
      frequency_manual: Only when I start one
      max_pages_label: Pages per audit
      max_pages_help: The most pages one audit checks. On a bigger forum each audit checks the pages checked longest ago, so the whole forum is covered over several audits.
      pages_per_minute_label: Pages per minute
      pages_per_minute_help: How fast the audit goes. 20 (one page every three seconds) is gentle on any server.
      timeout_label: Wait for a page (seconds)
      timeout_help: A page that takes longer is recorded as failed.
      keep_runs_label: Audits of history to keep
      keep_runs_help: Score history older than this is removed.

